<title>Replace With A Name</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ 1. TOKENS: change colors here only. k1..k5 are the five "kinds"; each means one thing. k2..k5 also color code. ============ */
  :root {
    --bg: #f5f7f6; --surface: #ffffff; --ink: #16201f; --muted: #586665; --line: #cdd5d4; --line-strong: #7f8d8b;
    --accent: #0f766e; --accent-soft: #dcefec;
    --bad: #b42318; --bad-soft: #fbe9e7; --warn: #8a5a00;
    --k1: #586665; --k1-soft: #e9eeed;
    --k2: #2f5fd0; --k2-soft: #e4ebfb;
    --k3: #6d4bc4; --k3-soft: #ece6fa;
    --k4: #a15c00; --k4-soft: #f9ecd2;
    --k5: #0f766e; --k5-soft: #dcefec;
    --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101615; --surface: #171f1e; --ink: #e6eeec; --muted: #9aa9a7; --line: #2b3735; --line-strong: #6a7a77;
      --accent: #4fd1c0; --accent-soft: #163a36; --bad: #ff8a7a; --bad-soft: #3b1c18; --warn: #f0c060;
      --k1: #9aa9a7; --k1-soft: #1e2726; --k2: #8fb0ff; --k2-soft: #1a2747; --k3: #c0a6ff; --k3-soft: #2a2147;
      --k4: #f0c060; --k4-soft: #382d12; --k5: #4fd1c0; --k5-soft: #163a36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101615; --surface: #171f1e; --ink: #e6eeec; --muted: #9aa9a7; --line: #2b3735; --line-strong: #6a7a77;
    --accent: #4fd1c0; --accent-soft: #163a36; --bad: #ff8a7a; --bad-soft: #3b1c18; --warn: #f0c060;
    --k1: #9aa9a7; --k1-soft: #1e2726; --k2: #8fb0ff; --k2-soft: #1a2747; --k3: #c0a6ff; --k3-soft: #2a2147;
    --k4: #f0c060; --k4-soft: #382d12; --k5: #4fd1c0; --k5-soft: #163a36;
    color-scheme: dark;
  }

  /* ============ ENGINE STYLES: leave as they are ============ */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  .page { max-width: 1320px; min-height: 100%; margin: 0 auto; padding-block: 24px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 24px; }
  h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots button { width: 22px; height: 6px; padding: 0; border-radius: 3px; border: 0; background: var(--line); cursor: pointer; }
  .dots button.done { background: var(--line-strong); } .dots button.now { background: var(--accent); }

  .main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(32px, 5vw, 80px); align-items: center; }
  .main[data-side="text-first"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
  .main[data-side="text-first"] figure { order: 2; }
  figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .stage { width: 100%; height: min(68vh, 640px); }
  svg.flow { width: 100%; height: 100%; display: block; }
  .main[data-layout="text"] { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .main[data-layout="text"] figure { display: none; }
  .main[data-layout="text"] .side { max-width: 780px; }
  .main[data-layout="text"] .slide h1 { font-size: clamp(34px, 4.6vw, 64px); }
  .main[data-layout="text"] .slide .body { max-width: 52ch; }
  .main[data-layout="wide"] { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .main[data-layout="wide"] .stage { height: min(50vh, 520px); }
  .main[data-layout="wide"] figure { order: 0; }
  .main[data-layout="wide"] .slide .body { max-width: 70ch; }
  .main.exploring { align-items: start; } .main.exploring .stage { height: min(82vh, 780px); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; }
  .legend u { width: 18px; height: 0; border-top: 1.5px solid var(--line-strong); text-decoration: none; } .legend u.dashed { border-top-style: dashed; }

  /* diagram marks */
  .flow text { font-family: var(--font-body); fill: var(--ink); }
  .flow .t-eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; fill: var(--muted); }
  .flow .t-name { font-size: 14px; font-weight: 600; }
  .flow .t-small, .flow .t-label { font-size: 11px; fill: var(--muted); }
  .flow .t-status { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; fill: var(--muted); }
  .flow .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.25; }
  .flow .box.later { stroke-dasharray: 5 4; }
  .flow .group { fill: none; stroke: var(--line); stroke-width: 1.25; }
  .flow .wire { fill: none; stroke: var(--line-strong); stroke-width: 1.25; }
  .flow .wire.later { stroke-dasharray: 5 4; }
  .flow .arrowhead { fill: var(--line-strong); }
  .flow [data-part] { transition: opacity 0.25s ease; }
  .flow .dim { opacity: 0.16; }
  .flow .node { cursor: pointer; outline: none; }
  .flow .node:focus-visible .box { stroke-width: 3.5; }
  .flow .node.is-focus .box, .flow .node.is-selected .box { stroke-width: 3; }
  .flow .hot .wire { stroke: var(--accent); stroke-width: 2.25; } .flow .hot .t-label { fill: var(--accent); font-weight: 600; }
  .flow .node.st-bad .box { stroke: var(--bad); fill: var(--bad-soft); stroke-width: 2.5; } .flow .node.st-bad .t-status { fill: var(--bad); }
  .flow .node.st-warn .t-status { fill: var(--warn); } .flow .node.st-good .t-status { fill: var(--accent); }
  /* image with regions: everything outside the listed regions is shaded */
  .flow .shade { fill: var(--bg); opacity: 0.8; pointer-events: none; }
  .flow .region { fill: transparent; stroke: none; }
  .flow .is-focus .region, .flow .hot .region { stroke: var(--accent); stroke-width: 2.5; }
  /* table, text or code: the stage scrolls to the listed parts and fades the rest */
  .stage.scroll { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .sheet { padding: 16px; font-size: 14px; }
  .sheet [data-part] { transition: opacity 0.25s ease, background 0.25s ease; }
  .sheet .dim { opacity: 0.25; }
  .sheet .is-focus, .sheet tr.is-focus > *, .sheet .hot, .sheet tr.hot > * { background: var(--accent-soft); }
  .sheet table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .sheet th, .sheet td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .sheet th { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .sheet .num { text-align: right; }
  .sheet thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .sheet .node { cursor: pointer; }
  .sheet .node:hover > *, .sheet .node:focus-visible > * { background: var(--accent-soft); }
  .sheet .node:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sheet .is-selected, .sheet tr.is-selected > * { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .legend:empty { display: none; }
  .sheet p[data-part] { display: block; padding: 4px 8px; border-radius: 4px; margin: 0 0 6px; }
  /* code: the engine numbers the lines of <pre class="code"> and colors them */
  .sheet:has(pre.code) { padding: 10px 0; }
  .sheet pre.code { margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
  .sheet pre.code .ln { display: grid; grid-template-columns: 3.2em 1.1em minmax(0, 1fr); padding-right: 10px; }
  .sheet .no { font-style: normal; color: var(--muted); opacity: 0.75; text-align: right; padding-right: 0.9em; user-select: none; }
  .sheet .mk { font-style: normal; color: var(--muted); user-select: none; }
  .sheet .ln.add { background: color-mix(in srgb, var(--accent) 14%, transparent); } .sheet .ln.add .mk { color: var(--accent); }
  .sheet .ln.del { background: color-mix(in srgb, var(--bad) 14%, transparent); } .sheet .ln.del .mk { color: var(--bad); }
  .sheet .ln.is-focus { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-meta { color: var(--k3); }
  .hljs-string, .hljs-regexp, .hljs-attr { color: var(--k5); }
  .hljs-number, .hljs-symbol { color: var(--k4); }
  .hljs-title, .hljs-built_in, .hljs-type, .hljs-name { color: var(--k2); }
  /* numbered markers on image regions */
  .flow .marker circle { fill: var(--accent); } .flow .marker text { fill: var(--bg); font-weight: 600; font-family: var(--font-body); }
  .flow .dim .marker { display: none; }
  .flow .region { vector-effect: non-scaling-stroke; }
  /* tabs: which file or screen is showing */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-self: stretch; }
  .tabs button { font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); cursor: pointer; }
  .tabs button.now { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  @media (prefers-reduced-motion: reduce) { .flow [data-part], .sheet [data-part] { transition: none; } }

  .side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .slide { display: flex; flex-direction: column; gap: 16px; }
  .slide h1 { font-size: clamp(30px, 3.3vw, 46px); line-height: 1.1; letter-spacing: -0.015em; }
  .slide .body { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; max-width: 36ch; }
  .example { border-left: 2px solid var(--line-strong); padding-left: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 46ch; }
  .example.bad { border-left-color: var(--bad); } .example.good { border-left-color: var(--accent); }
  .example .quote { color: var(--muted); }
  .verdict { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .verdict.good { color: var(--accent); } .verdict.bad { color: var(--bad); } .verdict.warn { color: var(--warn); }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--surface); display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
  .card .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 2px; } .card .v { overflow-wrap: anywhere; }

  .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nav .hint { color: var(--muted); font-size: 13px; }
  button.btn { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.btn:disabled { opacity: 0.4; cursor: default; }

  .explore { display: flex; flex-direction: column; gap: 16px; }
  .explore h2 { font-size: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; } .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span { display: flex; flex-direction: column; gap: 1px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .chip b { font-weight: 500; font-size: 13.5px; } .chip i { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .panel h2 { font-size: 20px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tag { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; }
  dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; } dd { margin: 0; }
  .trace { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; } footer a { color: var(--accent); }

  /* Phones and narrow windows: diagram on top, text under it, buttons pinned to the bottom. Swipe also works. */
  @media (max-width: 860px) {
    .page { gap: 14px; padding-block: 14px 0; }
    .main, .main[data-side], .main[data-layout="wide"] { grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
    .main[data-side] figure { order: 0; }
    .stage, .main[data-layout="wide"] .stage { height: min(42vh, 380px); }
    .main.exploring .stage { height: min(60vh, 520px); }
    .slide h1, .main[data-layout="text"] .slide h1 { font-size: 26px; }
    .slide .body { font-size: 16.5px; max-width: none; }
    .main[data-layout="text"] { align-items: center; }
    .nav { position: sticky; bottom: 0; background: var(--bg); padding-block: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin-top: auto; }
    .nav .btn { flex: 1; }
    footer { display: none; }
    dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } dd { margin-bottom: 8px; }
    .sheet { padding: 8px; font-size: 13px; } .sheet th, .sheet td { padding: 7px 6px; }
  }

  /* ============ 1b. YOUR OWN STYLES: anything specific to this walkthrough (type sizes for your fonts, table indents, chart marks) goes here, after the engine styles so it wins. ============ */
</style>

<!-- ============ 2. THE VISUAL: replace this svg. It can be a diagram or chart (rules below), an image with regions, a table, or text or code.
     For the last three, copy the pattern from the reference files. With one visual, keep id="flow" on it.
     With several (files, screens), give each one data-scene="id" and data-label="Name shown on its tab"; part ids must be unique across all of them.
     Rules for a diagram or chart:
     - Every box, line and group is wrapped in <g data-part="some-id">. The engine zooms, dims and highlights by these ids.
     - A clickable box is <g class="node" data-part="id" data-kind="k1..k5" tabindex="0" role="button" aria-label="...">

     - A line is <g data-part="id"> holding <path class="wire" marker-end="url(#ah)"> and <text class="t-label"> saying what moves along it.
     - Add class "later" to a box or wire to draw it dashed. Dashed means one thing you choose (later in time, planned, money vs messages); name it in `lineKey`.
     - Two flows over the same boxes (a request and its reply, messages now and money later) get two parallel wires with their own ids and labels.
     - Keep t-eyebrow to 12 characters and status text to 10, or they collide inside a box.
     - Text 10px or larger in the drawing's own units. No colors in the svg; classes carry them.
     - Draw compact. A diagram about as tall as it is wide zooms well on phones and laptops alike. ============ -->

<script>
/* ============ 3. CONTENT: replace this object. The engine below reads it. ============
   slides[]: one idea each.
     kicker   small label above the headline          kind   k1..k5, colors the kicker to match a box
     title    the point of the slide, as a sentence   body   one or two sentences
     on       ids kept at full strength, or 'all'     focus  node ids to outline (the first one is where a click on that box jumps)
     hot      line ids to highlight                   status {nodeId: ['good'|'bad'|'warn'|'', 'short text']}
     (on: 'all' dims nothing. On a whole-system slide, use `hot` and `status` to say where to look.)
     layout   'split' (default) | 'text' (no diagram, for an opener or closer) | 'wide' (diagram above, text below)
     view     optional [x, y, w, h]; leave it out and the engine zooms to whatever is in `on`
     example  {tone: 'good'|'bad'|'', quote, verdict, card: [[key, value], ...]}  at most one per slide
     scene    which visual the slide is on. Worked out from `on` or `focus` when left out; otherwise stays on the previous slide's.
     lines    for code: [12, 18] or [[12, 18], [30, 31]]. Lights those lines of the slide's scene. Use it in place of `on` and `focus`.
   Optional explore view, shown as the last slide when `details` is present (or set explore: true to let the reader browse with no detail panel):
     details  {nodeId: {kicker, name, status, rows: [[label, text], ...]}}
     items    [{id, title, tag, path: {nodeId: ['good'|'bad'|'warn', 'what happens here', optional card rows]}}]  */
window.WALKTHROUGH = {
  name: 'Team · Example walkthrough',
  side: 'text-first',                   // 'text-first' (default: headline left, visual right) or 'visual-first'
  kinds: { k4: 'person', k2: 'service', k5: 'record' },
  lineKey: { solid: '', dashed: '' },   // optional: what solid and dashed lines mean; shown in the key
  footer: 'Say where the examples and facts come from.',
  exploreTitle: 'Look around yourself',
  slides: [
    { layout: 'text', kicker: 'The idea', title: 'State the one thing the reader should leave with.', body: 'One or two sentences that set up the rest.' },
